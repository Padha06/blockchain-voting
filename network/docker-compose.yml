# Zero-gas college app-chain — one validator + public RPC (Geth Clique, gasPrice 0).
# Boot:  ./init.sh  (once)  then  docker compose up -d
# RPC:   http://HOST:8545   chainId 20260   gasPrice 0
# NOTE: single-sealer setup is for staging/college. Add 2 more validators
# (same genesis, peer via --bootnodes) before calling anything "production".
services:
  init:
    image: ethereum/client-go:v1.13.14
    volumes:
      - geth-data:/data
      - ./genesis.json:/genesis.json:ro
      - ./sealer.key:/sealer.key:ro
      - ./password.txt:/data/password.txt:ro
    command: >
      sh -c "geth init --datadir /data /genesis.json &&
             geth account import --datadir /data --password /data/password.txt /sealer.key || true"
    profiles: ["init"]

  validator:
    image: ethereum/client-go:v1.13.14
    depends_on:
      - init
    volumes:
      - geth-data:/data
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
      - "30303:30303/udp"
    command: >
      --datadir /data
      --networkid 20260
      --http --http.addr 0.0.0.0 --http.port 8545
      --http.api eth,net,web3,txpool,clique
      --http.corsdomain "*"
      --ws --ws.addr 0.0.0.0 --ws.port 8546 --ws.api eth,net,web3,txpool
      --mine --miner.etherbase 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
      --unlock 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
      --password /data/password.txt --allow-insecure-unlock
      --syncmode full --gcmode archive
      --gasprice 0 --miner.gasprice 0 --miner.gaslimit 30000000
    restart: unless-stopped

volumes:
  geth-data:
